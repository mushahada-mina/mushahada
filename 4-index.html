<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مشاهدة — منصة الفيديو الجديدة</title>
<style>
  /* ===== قالب واجهة موقع فيديو شبه يوتيوب (متوصلة بالسيرفر) ===== */
  /* لتغيير اسم المنصة: ابحث عن كلمة "مشاهدة" واستبدلها بالاسم اللي يعجبك */

  :root {
    --bg: #0f0f0f;          /* خلفية الصفحة */
    --bg-soft: #1f1f1f;     /* خلفية البطاقات والشريط */
    --bg-hover: #272727;
    --text: #f1f1f1;
    --text-dim: #aaa;
    --accent: #f03;         /* لون الشعار والأزرار المهمة */
    --border: #303030;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif;
    min-height: 100vh;
  }

  button { font-family: inherit; cursor: pointer; }

  /* ===== الشريط العلوي ===== */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: var(--bg);
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--text);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--bg-hover); }
  .icon-btn svg { width: 22px; height: 22px; fill: currentColor; }

  .logo {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 20px;
    font-weight: 700;
    white-space: nowrap;
    user-select: none;
  }
  .logo .mark {
    width: 30px;
    height: 21px;
    background: var(--accent);
    border-radius: 6px;
    position: relative;
    flex-shrink: 0;
  }
  .logo .mark::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: 6px solid transparent;
    border-left-color: #fff;   /* في RTL المثلث بيشير للشمال */
    margin-left: -2px;
  }

  .search-box {
    flex: 1;
    min-width: 0;          /* مهم: يسمح للبحث يضيق على الموبايل */
    max-width: 560px;
    margin: 0 auto;
    display: flex;
  }
  .search-box input {
    flex: 1;
    min-width: 0;
    background: #121212;
    border: 1px solid var(--border);
    border-inline-end: none;
    border-radius: 0 20px 20px 0;   /* الحرف الخارجي يمين في RTL */
    padding: 10px 16px;
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  .search-box input:focus { border-color: #1c62b9; }
  .search-box button {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 20px 0 0 20px;   /* زر البحث شمال في RTL */
    padding: 0 20px;
    color: var(--text);
  }
  .search-box button svg { width: 20px; height: 20px; fill: currentColor; display: block; }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #5b4bdb, #2ea6ff);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    flex-shrink: 0;
  }

  /* ===== شريط التصنيفات ===== */
  .chips {
    display: flex;
    gap: 10px;
    padding: 10px 16px;
    overflow-x: auto;
    scrollbar-width: none;
    position: sticky;
    top: 56px;
    z-index: 15;
    background: var(--bg);
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    background: var(--bg-soft);
    border: none;
    color: var(--text);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 14px;
    white-space: nowrap;
  }
  .chip.active, .chip:hover { background: var(--text); color: #0f0f0f; }

  /* ===== الهيكل: القائمة الجانبية + المحتوى ===== */
  .layout { display: flex; }

  .sidebar {
    width: 220px;
    padding: 8px;
    flex-shrink: 0;
  }
  .side-item {
    display: flex;
    align-items: center;
    gap: 18px;
    width: 100%;
    background: none;
    border: none;
    color: var(--text);
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    text-align: right;
  }
  .side-item:hover { background: var(--bg-hover); }
  .side-item.active { background: var(--bg-soft); font-weight: 700; }
  .side-item svg { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }
  .side-sep { border-top: 1px solid var(--border); margin: 10px 4px; }
  .side-note {
    color: var(--text-dim);
    font-size: 12px;
    line-height: 1.7;
    padding: 10px 14px;
  }

  /* ===== المحتوى الرئيسي (فاضي) ===== */
  .content {
    flex: 1;
    min-height: calc(100vh - 120px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px 96px;
  }

  .empty {
    text-align: center;
    max-width: 420px;
  }
  .empty .big-icon {
    width: 120px;
    height: 120px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--bg-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .empty .big-icon svg { width: 56px; height: 56px; fill: var(--text-dim); }
  .empty h1 { font-size: 22px; margin-bottom: 10px; }
  .empty p { color: var(--text-dim); font-size: 15px; line-height: 1.8; margin-bottom: 22px; }

  .upload-btn {
    background: var(--text);
    color: #0f0f0f;
    border: none;
    border-radius: 20px;
    padding: 11px 24px;
    font-size: 15px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .upload-btn:hover { background: #fff; }
  .upload-btn svg { width: 18px; height: 18px; fill: currentColor; }

  /* ===== رسالة التنبيه (توست) ===== */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 50%;
    transform: translateX(50%) translateY(80px);
    background: #f1f1f1;
    color: #0f0f0f;
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 14px;
    opacity: 0;
    transition: all 0.3s ease;
    z-index: 50;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(50%) translateY(0); }

  /* ===== الشريط السفلي للموبايل ===== */
  .bottom-nav { display: none; }

  /* ===== الموبايل ===== */
  @media (max-width: 760px) {
    .sidebar { display: none; }
    .search-box input { font-size: 14px; padding: 8px 12px; }
    .topbar .hide-mobile { display: none; }
    .content { min-height: calc(100vh - 180px); }

    .bottom-nav {
      display: flex;
      position: fixed;
      bottom: 0;
      right: 0;
      left: 0;
      background: var(--bg);
      border-top: 1px solid var(--border);
      z-index: 30;
      padding: 4px 0 8px;
    }
    .bottom-nav button {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-dim);
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 0;
    }
    .bottom-nav button.active { color: var(--text); }
    .bottom-nav button svg { width: 22px; height: 22px; fill: currentColor; }
  }

  /* ===== إضافات الباك إند ===== */
  .content.has-items { display: block; align-items: initial; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px 14px; }
  .card { cursor: pointer; }
  .card video { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: var(--radius); display: block; object-fit: cover; pointer-events: none; }
  .card h3 { font-size: 15px; margin: 8px 0 3px; line-height: 1.5; }
  .card .meta { color: var(--text-dim); font-size: 13px; }
  .card img { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: var(--radius); display: block; object-fit: cover; pointer-events: none; }
  .watch iframe { width: 100%; aspect-ratio: 16/9; border: 0; background: #000; border-radius: var(--radius); }
  .watch video { width: 100%; max-height: 70vh; background: #000; border-radius: var(--radius); }
  .watch h2 { font-size: 20px; margin: 12px 0 6px; }
  .watch .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--text-dim); font-size: 14px; margin-bottom: 10px; }
  .pill { background: var(--bg-soft); color: var(--text); border: none; border-radius: 20px; padding: 8px 16px; font-size: 14px; }
  .pill:hover { background: var(--bg-hover); }
  .pill.on { background: var(--text); color: #0f0f0f; }
  .desc { background: var(--bg-soft); border-radius: var(--radius); padding: 12px; font-size: 14px; line-height: 1.8; white-space: pre-wrap; margin-bottom: 18px; }
  .comments h4 { margin-bottom: 10px; }
  .c-form { display: flex; gap: 8px; margin-bottom: 14px; }
  .field { background: #121212; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; color: var(--text); font-size: 15px; font-family: inherit; width: 100%; outline: none; }
  .field:focus { border-color: #1c62b9; }
  .c-item { margin-bottom: 12px; font-size: 14px; line-height: 1.7; }
  .c-item b { margin-inline-end: 8px; }
  .back { margin-bottom: 10px; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--bg-soft); border-radius: 16px; padding: 22px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; }
  .modal h3 { font-size: 18px; }
  .modal .err { color: #ff6b6b; font-size: 13px; min-height: 16px; }
  .modal .links { color: var(--text-dim); font-size: 13px; }
  .modal .links a { color: #3ea6ff; cursor: pointer; }
  .progress { height: 6px; background: var(--bg-hover); border-radius: 3px; overflow: hidden; display: none; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); }
</style>
</head>
<body>

  <!-- الشريط العلوي -->
  <header class="topbar">
    <div class="logo">
      <span class="mark"></span>
      <span>مشاهدة</span>
    </div>

    <form class="search-box" id="searchForm">
      <input type="search" id="searchInput" placeholder="ابحث عن فيديو…" aria-label="بحث">
      <button type="submit" aria-label="بحث">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
      </button>
    </form>

    <button class="icon-btn hide-mobile" id="uploadIcon" aria-label="تحميل فيديو" title="تحميل فيديو">
      <svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
    </button>
    <button class="icon-btn hide-mobile" id="bellIcon" aria-label="الإشعارات" title="الإشعارات">
      <svg viewBox="0 0 24 24"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5a6 6 0 0 0-4.5-5.8V4.5a1.5 1.5 0 0 0-3 0v.7A6 6 0 0 0 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
    </button>
    <button class="avatar" id="avatar" title="حسابك" style="border:none;color:#fff">؟</button>
  </header>

  <!-- شريط التصنيفات -->
  <nav class="chips" id="chips">
    <button class="chip active">الكل</button>
    <button class="chip">بث مباشر</button>
    <button class="chip">موسيقى</button>
    <button class="chip">ألعاب</button>
    <button class="chip">أخبار</button>
    <button class="chip">رياضة</button>
    <button class="chip">تعليم</button>
    <button class="chip">طبخ</button>
  </nav>

  <div class="layout">
    <!-- القائمة الجانبية -->
    <aside class="sidebar">
      <button class="side-item active">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        الرئيسية
      </button>
      <button class="side-item">
        <svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        بث مباشر
      </button>
      <button class="side-item">
        <svg viewBox="0 0 24 24"><path d="M20 2H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-9 5h6v2h-6zm0 4h4v2h-4zM4 6H2v14a2 2 0 0 0 2 2h14v-2H4z"/></svg>
        الاشتراكات
      </button>
      <button class="side-item">
        <svg viewBox="0 0 24 24"><path d="M12 3v9.28a4.39 4.39 0 0 0-1.5-.28C8.01 12 6 14.21 6 17s2.01 5 4.5 5 4.5-2.24 4.5-5V7h4V3h-7z"/></svg>
        المكتبة
      </button>
      <button class="side-item">
        <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.9 3.9L8.8 12H6a7 7 0 1 1 7 7 6.9 6.9 0 0 1-4.9-2H5.9A9 9 0 1 0 13 3zm-1 5v5l4.3 2.6.7-1.3-3.5-2V8H12z"/></svg>
        السجل
      </button>
      <div class="side-sep"></div>
      <button class="side-item">
        <svg viewBox="0 0 24 24"><path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6a.5.5 0 0 0 .1-.6l-2-3.4a.5.5 0 0 0-.6-.2l-2.4 1a7.6 7.6 0 0 0-1.7-1l-.4-2.5a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.5a7.6 7.6 0 0 0-1.7 1l-2.4-1a.5.5 0 0 0-.6.2l-2 3.4a.5.5 0 0 0 .1.6l2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6a.5.5 0 0 0-.1.6l2 3.4c.1.2.4.3.6.2l2.4-1a7.6 7.6 0 0 0 1.7 1l.4 2.5c0 .2.2.4.5.4h4c.2 0 .4-.2.5-.4l.4-2.5a7.6 7.6 0 0 0 1.7-1l2.4 1c.2.1.5 0 .6-.2l2-3.4a.5.5 0 0 0-.1-.6L19.4 13zM12 15.5A3.5 3.5 0 1 1 15.5 12 3.5 3.5 0 0 1 12 15.5z"/></svg>
        الإعدادات
      </button>
      <div class="side-sep"></div>
      <p class="side-note" id="sideUser">مش مسجل دخول</p>
    </aside>

    <!-- المحتوى: حالة فاضية -->
    <main class="content" id="main">
      <div class="empty" id="emptyState">
        <div class="big-icon">
          <svg viewBox="0 0 24 24"><path d="M21 3H3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zM10 16.5v-9l6 4.5-6 4.5z"/></svg>
        </div>
        <h1 id="emptyTitle">لا توجد فيديوهات بعد</h1>
        <p id="emptyText">منصتك الجديدة جاهزة.<br>ابدأ بإضافة أول فيديو يوتيوب.</p>
        <button class="upload-btn" id="uploadBtn">
          <svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg>
          إضافة فيديو
        </button>
      </div>
      <div class="grid" id="grid" hidden></div>
      <div class="watch" id="watch" hidden></div>
    </main>
  </div>

  <!-- الشريط السفلي للموبايل -->
  <nav class="bottom-nav">
    <button class="active">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      الرئيسية
    </button>
    <button>
      <svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      مباشر
    </button>
    <button id="uploadIconMobile">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4z"/></svg>
      تحميل
    </button>
    <button>
      <svg viewBox="0 0 24 24"><path d="M20 2H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM4 6H2v14a2 2 0 0 0 2 2h14v-2H4z"/></svg>
      الاشتراكات
    </button>
    <button>
      <svg viewBox="0 0 24 24"><path d="M12 3v9.28a4.39 4.39 0 0 0-1.5-.28C8.01 12 6 14.21 6 17s2.01 5 4.5 5 4.5-2.24 4.5-5V7h4V3h-7z"/></svg>
      المكتبة
    </button>
  </nav>


  <div class="modal-bg" id="authModal"><form class="modal" id="authForm">
    <h3 id="authTitle">تسجيل الدخول</h3>
    <input class="field" id="aUser" placeholder="اسم المستخدم" autocomplete="username" required>
    <input class="field" id="aPass" type="password" placeholder="كلمة السر (6 حروف على الأقل)" autocomplete="current-password" required>
    <div class="err" id="authErr"></div>
    <button class="pill on" type="submit" id="authSubmit">دخول</button>
    <div class="links"><span id="authSwitchTxt">معندكش حساب؟</span> <a id="authSwitch">أنشئ حساب</a> · <a id="authClose">إغلاق</a></div>
  </form></div>
  <div class="modal-bg" id="upModal"><form class="modal" id="upForm">
    <h3>إضافة فيديو يوتيوب</h3>
    <input class="field" id="uTitle" placeholder="عنوان الفيديو" maxlength="120" required>
    <textarea class="field" id="uDesc" rows="3" placeholder="وصف (اختياري)"></textarea>
    <input class="field" id="uFile" type="url" dir="ltr" placeholder="رابط فيديو يوتيوب (https://youtu.be/...)" required>
    <div class="progress" id="uProg"><i></i></div>
    <div class="err" id="upErr"></div>
    <button class="pill on" type="submit" id="upSubmit">إضافة</button>
    <div class="links"><a id="upClose">إغلاق</a></div>
  </form></div>
  <!-- رسالة التنبيه -->
  <div class="toast" id="toast" role="status"></div>

<script>
  var toastTimer, token = localStorage.getItem('token'), me = JSON.parse(localStorage.getItem('user') || 'null');
  var curQuery = '', regMode = false;
  var $ = function (id) { return document.getElementById(id); };
  function showToast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }
  function esc(x) { return String(x).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  // ===== نسخة ثابتة (GitHub Pages): الحسابات والتعليقات واللايكات محفوظة في متصفحك بس =====
  function ytId(u) {
    var m = String(u).trim().match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }
  function ls(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (_) { return d; } }
  function sv(k, v) { localStorage.setItem(k, JSON.stringify(v)); }
  function nowStr() { return new Date().toISOString().slice(0, 19).replace('T', ' '); }
  var baseVideos = null;
  function allVideos() {
    var p = baseVideos ? Promise.resolve(baseVideos) : fetch('videos.json').then(function (r) { return r.json(); }).catch(function () { return []; }).then(function (b) {
      b.forEach(function (v, i) { v.id = 'b' + (i + 1); }); baseVideos = b; return b; });
    return p.then(function (b) {
      var mine = ls('videos', []);
      return mine.concat(b.slice().reverse()).map(function (v) { v.url = v.yt; return v; });
    });
  }
  function api(path, opts) {
    opts = opts || {}; var j = opts.json || {}, method = opts.method || 'GET';
    var fail = function (m) { return Promise.reject(new Error(m)); }, ok = function (d) { return Promise.resolve(d); };
    var users = ls('users', {}), m;
    if (path === '/api/register') {
      var u = String(j.username || '').trim();
      if (u.length < 2) return fail('اسم المستخدم قصير');
      if (String(j.password || '').length < 6) return fail('كلمة السر 6 حروف على الأقل');
      if (users[u]) return fail('الاسم ده مستخدم');
      users[u] = j.password; sv('users', users); return ok({ token: 't-' + u, user: { username: u } });
    }
    if (path === '/api/login') {
      var n = String(j.username || '').trim();
      if (users[n] === undefined || users[n] !== j.password) return fail('اسم المستخدم أو كلمة السر غلط');
      return ok({ token: 't-' + n, user: { username: n } });
    }
    if (path.indexOf('/api/videos') === 0 && path.split('?')[0] === '/api/videos' && method === 'GET') {
      var q = decodeURIComponent((path.split('q=')[1] || '')).toLowerCase();
      return allVideos().then(function (vs) {
        return { videos: vs.filter(function (v) { return !q || v.title.toLowerCase().indexOf(q) >= 0; }).map(function (v) { v.views = (ls('views', {})[v.id] || 0); return v; }) };
      });
    }
    if (path === '/api/videos' && method === 'POST') {
      var id = ytId(j.link); if (!id) return fail('الرابط مش رابط يوتيوب صحيح');
      if (!String(j.title || '').trim()) return fail('اكتب عنوان للفيديو');
      var mine = ls('videos', []); var nv = { id: 'm' + Date.now(), yt: id, title: j.title.trim().slice(0, 120), description: (j.description || '').slice(0, 2000), author: me.username, created_at: nowStr() };
      mine.unshift(nv); sv('videos', mine); return ok({ id: nv.id });
    }
    if ((m = path.match(/^\/api\/videos\/([^\/]+)(\/like|\/comments)?$/))) {
      var vid = decodeURIComponent(m[1]), sub = m[2];
      if (sub === '/comments') {
        var cs = ls('comments', {}); cs[vid] = cs[vid] || [];
        if (method === 'POST') { cs[vid].unshift({ author: me.username, body: j.body, created_at: nowStr() }); sv('comments', cs); return ok({}); }
        return ok({ comments: cs[vid] });
      }
      if (sub === '/like') {
        var lk = ls('likes', {}); lk[vid] = lk[vid] || []; var i = lk[vid].indexOf(me.username);
        if (i >= 0) lk[vid].splice(i, 1); else lk[vid].push(me.username); sv('likes', lk);
        return ok({ liked: i < 0, likes: lk[vid].length });
      }
      if (method === 'DELETE') { sv('videos', ls('videos', []).filter(function (v) { return v.id !== vid; })); return ok({ ok: true }); }
      return allVideos().then(function (vs) {
        var v = vs.filter(function (x) { return x.id === vid; })[0]; if (!v) throw new Error('الفيديو مش موجود');
        var vw = ls('views', {}); vw[vid] = (vw[vid] || 0) + 1; sv('views', vw); v.views = vw[vid];
        v.likes = (ls('likes', {})[vid] || []).length; return v;
      });
    }
    return fail('حصل خطأ');
  }
  function setUser(t, u) {
    token = t; me = u;
    if (t) { localStorage.setItem('token', t); localStorage.setItem('user', JSON.stringify(u)); }
    else { localStorage.removeItem('token'); localStorage.removeItem('user'); }
    $('avatar').textContent = u ? u.username.charAt(0).toUpperCase() : '؟';
    $('sideUser').innerHTML = u ? 'مسجل دخول باسم <b>' + esc(u.username) + '</b><br><a href="#" id="logout" style="color:#3ea6ff">خروج</a>' : 'مش مسجل دخول';
    var lo = $('logout'); if (lo) lo.onclick = function (e) { e.preventDefault(); setUser(null, null); showToast('تم تسجيل الخروج'); route(); };
  }
  function needLogin() { if (token) return false; openAuth(false); showToast('سجل دخول الأول'); return true; }

  // ===== الدخول والتسجيل =====
  function openAuth(reg) {
    regMode = reg;
    $('authTitle').textContent = reg ? 'إنشاء حساب' : 'تسجيل الدخول';
    $('authSubmit').textContent = reg ? 'إنشاء حساب' : 'دخول';
    $('authSwitchTxt').textContent = reg ? 'عندك حساب؟' : 'معندكش حساب؟';
    $('authSwitch').textContent = reg ? 'سجل دخول' : 'أنشئ حساب';
    $('authErr').textContent = ''; $('authModal').classList.add('show');
  }
  $('authSwitch').onclick = function () { openAuth(!regMode); };
  $('authClose').onclick = function () { $('authModal').classList.remove('show'); };
  $('avatar').onclick = function () { if (!token) openAuth(false); else showToast('أهلا ' + me.username); };
  $('authForm').addEventListener('submit', function (e) {
    e.preventDefault();
    api(regMode ? '/api/register' : '/api/login', { method: 'POST', json: { username: $('aUser').value, password: $('aPass').value } })
      .then(function (d) { setUser(d.token, d.user); $('authModal').classList.remove('show'); $('aPass').value = ''; showToast('أهلا ' + d.user.username); route(); })
      .catch(function (er) { $('authErr').textContent = er.message; });
  });

  // ===== الرفع =====
  function openUpload() { if (needLogin()) return; $('upErr').textContent = ''; $('upModal').classList.add('show'); }
  $('upClose').onclick = function () { $('upModal').classList.remove('show'); };
  ['uploadBtn', 'uploadIcon', 'uploadIconMobile'].forEach(function (id) { $(id).addEventListener('click', openUpload); });
  $('bellIcon').addEventListener('click', function () { showToast('لا توجد إشعارات جديدة'); });
  $('upForm').addEventListener('submit', function (e) {
    e.preventDefault();
    api('/api/videos', { method: 'POST', json: { title: $('uTitle').value, description: $('uDesc').value, link: $('uFile').value } })
      .then(function (d) { $('upModal').classList.remove('show'); $('upForm').reset(); showToast('تمت الإضافة'); location.hash = '#/v/' + d.id; })
      .catch(function (er) { $('upErr').textContent = er.message; });
  });

  // ===== القائمة والبحث =====
  function showEmpty(title, text) {
    $('emptyTitle').textContent = title; $('emptyText').innerHTML = text;
    $('emptyState').hidden = false; $('grid').hidden = true; $('watch').hidden = true; $('main').classList.remove('has-items');
  }
  function ago(d) {
    var s = (Date.now() - new Date(d.replace(' ', 'T') + 'Z')) / 1000;
    if (s < 3600) return 'من ' + Math.max(1, Math.floor(s / 60)) + ' دقيقة';
    if (s < 86400) return 'من ' + Math.floor(s / 3600) + ' ساعة';
    return 'من ' + Math.floor(s / 86400) + ' يوم';
  }
  function loadList() {
    api('/api/videos?q=' + encodeURIComponent(curQuery)).then(function (d) {
      if (!d.videos.length) {
        if (curQuery) showEmpty('لا توجد نتائج عن «' + esc(curQuery) + '»', 'جرّب كلمة تانية.');
        else showEmpty('لا توجد فيديوهات بعد', 'منصتك الجديدة جاهزة.<br>ابدأ بإضافة أول فيديو يوتيوب.');
        return;
      }
      $('emptyState').hidden = true; $('watch').hidden = true; $('grid').hidden = false; $('main').classList.add('has-items');
      $('grid').innerHTML = d.videos.map(function (v) {
        return '<div class="card" data-id="' + esc(v.id) + '"><img src="https://i.ytimg.com/vi/' + v.url + '/hqdefault.jpg" alt="" loading="lazy"><h3>' + esc(v.title) + '</h3><div class="meta">' + esc(v.author) + ' · ' + v.views + ' مشاهدة · ' + ago(v.created_at) + '</div></div>';
      }).join('');
    }).catch(function (er) { showToast(er.message); });
  }
  $('grid').addEventListener('click', function (e) {
    var c = e.target.closest('.card'); if (c) location.hash = '#/v/' + c.dataset.id;
  });
  $('searchForm').addEventListener('submit', function (e) {
    e.preventDefault(); curQuery = $('searchInput').value.trim();
    if (location.hash) location.hash = ''; else route();
  });
  var chips = document.querySelectorAll('#chips .chip');
  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      chips.forEach(function (c) { c.classList.remove('active'); }); chip.classList.add('active');
      showToast('التصنيفات لسه شكلية، كل الفيديوهات بتظهر');
    });
  });

  // ===== صفحة المشاهدة =====
  function loadWatch(id) {
    api('/api/videos/' + id).then(function (v) {
      $('emptyState').hidden = true; $('grid').hidden = true; $('watch').hidden = false; $('main').classList.add('has-items');
      $('watch').innerHTML =
        '<button class="pill back" id="backBtn">→ رجوع</button>' +
        '<iframe src="https://www.youtube-nocookie.com/embed/' + v.url + '" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>' +
        '<h2>' + esc(v.title) + '</h2>' +
        '<div class="row"><span>' + esc(v.author) + ' · ' + v.views + ' مشاهدة · ' + ago(v.created_at) + '</span>' +
        '<button class="pill" id="likeBtn">👍 <span id="likeN">' + v.likes + '</span></button>' +
        ((me && me.username === v.author) ? '<button class="pill" id="delBtn">مسح الفيديو</button>' : '') + '</div>' +
        (v.description ? '<div class="desc">' + esc(v.description) + '</div>' : '') +
        '<div class="comments"><h4 id="cCount">التعليقات</h4><form class="c-form" id="cForm"><input class="field" id="cBody" placeholder="اكتب تعليق…" maxlength="1000"><button class="pill on" type="submit">نشر</button></form><div id="cList"></div></div>';
      $('backBtn').onclick = function () { location.hash = ''; };
      $('likeBtn').onclick = function () {
        if (needLogin()) return;
        api('/api/videos/' + id + '/like', { method: 'POST' }).then(function (d) { $('likeN').textContent = d.likes; $('likeBtn').classList.toggle('on', d.liked); });
      };
      var del = $('delBtn');
      if (del) del.onclick = function () {
        if (!confirm('متأكد إنك عايز تمسح الفيديو؟')) return;
        api('/api/videos/' + id, { method: 'DELETE' }).then(function () { showToast('تم المسح'); location.hash = ''; }).catch(function (er) { showToast(er.message); });
      };
      $('cForm').addEventListener('submit', function (e) {
        e.preventDefault(); if (needLogin()) return;
        var b = $('cBody').value.trim(); if (!b) return;
        api('/api/videos/' + id + '/comments', { method: 'POST', json: { body: b } }).then(function () { $('cBody').value = ''; loadComments(id); }).catch(function (er) { showToast(er.message); });
      });
      loadComments(id); window.scrollTo(0, 0);
    }).catch(function (er) { showToast(er.message); location.hash = ''; });
  }
  function loadComments(id) {
    api('/api/videos/' + id + '/comments').then(function (d) {
      $('cCount').textContent = d.comments.length + ' تعليق';
      $('cList').innerHTML = d.comments.map(function (c) { return '<div class="c-item"><b>' + esc(c.author) + '</b><span style="color:var(--text-dim)">' + ago(c.created_at) + '</span><br>' + esc(c.body) + '</div>'; }).join('');
    });
  }

  function route() {
    var m = location.hash.match(/^#\/v\/([\w-]+)/);
    if (m) loadWatch(m[1]); else loadList();
  }
  window.addEventListener('hashchange', route);
  setUser(token, me);
  route();
</script>
</body>
</html>
